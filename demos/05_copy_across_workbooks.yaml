env:
  output_folder: "./demos/output"

workbooks:
  historical:
    file: "./demos/historical.xlsx"
  working_copy:
    file: "{{ env.output_folder }}/05_working_copy.xlsx"
    create_if_missing: true
    template: historical

steps:
  # copy: whole-sheet copy (source_range omitted)
  - id: copy_whole_sheet
    action: copy
    source:
      workbook: historical
      sheet: "Sheet"
    target:
      workbook: working_copy
      sheet: "Sheet"
      range: "A1"

  # copy: a specific source range into another target location
  - id: copy_one_cell
    action: copy
    source:
      workbook: historical
      sheet: "Sheet"
      range: "A1"
    target:
      workbook: working_copy
      sheet: "Sheet"
      range: "D1"
