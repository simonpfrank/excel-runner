[project]
name = "excel-runner"
version = "0.1.0"
description = "Declarative, YAML-driven Excel automation engine"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Simon Frank", email = "simonpfrank@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "xlwings>=0.31",
]

[project.urls]
Homepage = "https://github.com/simonpfrank/excel-runner"
Repository = "https://github.com/simonpfrank/excel-runner"

[project.scripts]
excel-runner = "excel_runner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "radon>=6.0",
    "vulture>=2.11",
    "pyright>=1.1",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["excel_runner*"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Bare attribute-access expressions are the standard vulture whitelist idiom, not real code.
"vulture_whitelist.py" = ["B018", "I001"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's built-in faulthandler plugin dumps a full C stack trace for every non-fatal Windows
# SEH exception it observes — including the RPC_E_SERVERFAULT (0x800706ba) errors that fire
# when a stale win32com proxy for an already-quit Excel process gets garbage-collected
# (xlwings/pywin32 on Windows, tests/unit/test_owned_instance_registry.py). Cosmetic only (all
# tests still pass/report normally) but floods the terminal at interpreter shutdown — disabled
# here since it adds no real diagnostic value for this project's own test failures.
addopts = ["-p", "no:faulthandler"]

[tool.coverage.run]
branch = true
source = ["excel_runner"]
